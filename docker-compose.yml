services:
  postgres:
    image: postgres:18
    container_name: pract-nextjs-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pract_nextjs

    ports:
      - "5433:5432"

    volumes:
      - pract_nextjs_postgres_data:/var/lib/postgresql

volumes:
  pract_nextjs_postgres_data: